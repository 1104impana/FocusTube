<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Focus-Tube</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <header> 
        <div class="top-bar">
    <h1>Focus<span style="color:#f32121; ">Tube</span></h1>
       
    </div>

    <p class="subtitle">
    Stay focused on learning
    </p>
    </header>

    <div class="tabs">
    <button id="focusTab" class="tab active">Focus</button>
    <button id="checklistTab" class="tab">Checklist</button>
   </div>



    <div class="main">

    
        <div class="interest-header">
            <span style="font-size:12px;color:#9ca3af; ">  INTERESTS</span>
            <button id="editBtn" title="Add Interest">+</button>
        </div>

        <div id="interestContainer">
            <span class="chip">GATE</span>
            <span class="chip">DSA</span>
        </div>

        <div id="editor" style="display:none;">
            <input
                type="text"
                id="interestInput"
                placeholder="Add Interest"
            >

            <button id="saveBtn">Save</button>
        </div>

        <br><br>

    </div>
    <div class="focus-section">
    <span style="font-size:12px;color:#9ca3af; ">  FOCUS MODE</span>

    <label class="switch">
        <input type="checkbox" id="focusToggle">
        <span class="slider round"></span>
    </label>
</div>

<p class="status" id="status">
    ● Inactive
</p>

    <script src="popup.js"></script>

</body>
</html>
